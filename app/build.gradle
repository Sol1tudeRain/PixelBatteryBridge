plugins { id 'com.android.application' }
android {
    namespace 'dev.local.pixelbatterybridge'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.local.pixelbatterybridge'
        minSdk 31
        targetSdk 32
        versionCode 2
        versionName '0.2.0-diagnostic'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    // Compile API signatures only; real classes are supplied by LSPosed at runtime.
    compileOnly project(':xposed-api-stubs')
}
